name: fotobot

on:
  schedule:
    # 3:30 UTC = 5:30 v Praze v letním čase, 4:30 v zimním. Běží Po–Pá.
    # Stalker startuje v 8:00 pražského času, takže rezerva je dvě a půl hodiny.
    # Cron na GitHubu je jen orientační a ve špičce startuje i o dvacet minut
    # později — proto ta velká rezerva.
    - cron: "30 3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fotobot
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    # 3.10.2026: job timeout UŽ NENÍ hlavní pojistka — tou jsou timeout-minutes
    # na jednotlivých krocích níž. Tohle je jen poslední záchytka.
    # Součet stropů fází je 40 + 45 + 10 + 10 = 105 min, plus instalace ~5.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Nainstaluj Playwright a Chromium
        timeout-minutes: 15
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.49.1 sharp@0.33.5
          npx playwright install --with-deps chromium

      # ⛔️ KLÍČOVÁ ZMĚNA (3.10.2026). Předtím měl strop jen celý job (150 min).
      # 2.10.2026 se focení zaseklo, sežralo celých 150 minut, GitHub job zabil
      # a NIC se necommitlo — ani fotky, ani feedy, ani ceníky. Stalker měl
      # v pátek i v sobotu prázdno.
      # Teď má focení vlastní strop. Když se zasekne, zabije se JEN ono,
      # continue-on-error pustí běh dál a fotky, co se stihly, se uloží.
      # Normální focení trvá ~20 min, takže 40 je dvojnásobná rezerva.
      - name: Vyfoť weby
        id: shoot
        timeout-minutes: 40
        continue-on-error: true
        env:
          OWN_HOME_URL: ${{ secrets.OWN_HOME_URL }}
          OWN_AI_URL: ${{ secrets.OWN_AI_URL }}
          OWN_AUTOMATION_URL: ${{ secrets.OWN_AUTOMATION_URL }}
          OWN_PRICING_URL: ${{ secrets.OWN_PRICING_URL }}
          OWN_FEATURES_URL: ${{ secrets.OWN_FEATURES_URL }}
          OWN_INTEGRATIONS_URL: ${{ secrets.OWN_INTEGRATIONS_URL }}
          OWN_ABOUT_URL: ${{ secrets.OWN_ABOUT_URL }}
          OWN_CAREERS_URL: ${{ secrets.OWN_CAREERS_URL }}
          OWN_SITEMAP_URL: ${{ secrets.OWN_SITEMAP_URL }}
        run: node shoot.mjs

      # POJISTKA: fotky se commitnou hned po focení. Kdyby se rozšíření
      # zaseklo nebo doběhlo do timeoutu, fotky už jsou v repu a Stalker
      # má z čeho brát.
      # 3.10.2026: if: always() + čtení report.json je ošetřené, protože
      # při zaseknutém focení může být report.json starý nebo chybět.
      - name: Commitni fotky
        if: always()
        run: |
          git config user.name "fotobot"
          git config user.email "fotobot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nic nového, necommituju."
          else
            CHANGED=$(node -e "try{const r=require('./report.json');console.log(r.counts.changed+'/'+r.counts.targets)}catch(e){console.log('?')}")
            git commit -m "fotky $(date -u +%F) (zmeneno ${CHANGED}, foceni=${{ steps.shoot.outcome }})"
            git pull --rebase || true
            git push
          fi

      - name: Feedy, ceníky, e-maily konkurence a datovaný archiv
        id: extras
        if: always()
        timeout-minutes: 45
        continue-on-error: true
        run: node extras.mjs

      # POJISTKA 2: co vyrobilo rozšíření, se commitne hned — ať to nespadne
      # s případným zaseknutím akce.mjs nebo clanky.mjs.
      - name: Commitni rozšíření
        if: always()
        run: |
          git config user.name "fotobot"
          git config user.email "fotobot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rozšíření nic nezměnilo, necommituju."
          else
            git commit -m "rozsireni $(date -u +%F)"
            git pull --rebase || true
            git push
          fi

      - name: Kalendáře akcí (přednášky a talky)
        id: akce
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: node akce.mjs

      - name: Články z blokovaných webů (Ecommerce Bridge)
        id: clanky
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: node clanky.mjs

      - name: Ukliď staré jednorázové fotky
        # Hlavní úklid (60 dní, všechny datované složky) si dělá extras.mjs sám.
        # Tohle je jen záloha pro případ, že by rozšíření nedoběhlo.
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          find queue-shots -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find changed -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find emails -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find pricing-shots -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find daily -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find rescue -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true

      # ⭐ NOVÉ (3.10.2026): vizitka běhu. Stalker na log GitHub Actions nevidí
      # (api.github.com je z jeho prostředí blokované), takže dosud nedokázal
      # rozlišit „běh vůbec nenaskočil" od „běh spadl". Tenhle soubor to řeší.
      - name: Zapiš status.json
        if: always()
        run: |
          cat > status.json <<EOF
          {
            "pokusAt": "$(date -u +%FT%TZ)",
            "datum": "$(date -u +%F)",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "spousteno": "${{ github.event_name }}",
            "faze": {
              "foceni": "${{ steps.shoot.outcome }}",
              "rozsireni": "${{ steps.extras.outcome }}",
              "akce": "${{ steps.akce.outcome }}",
              "clanky": "${{ steps.clanky.outcome }}"
            }
          }
          EOF
          cat status.json

      - name: Commitni úklid a status
        if: always()
        run: |
          git config user.name "fotobot"
          git config user.email "fotobot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nic se nezměnilo, necommituju."
          else
            git commit -m "status + uklid $(date -u +%F)"
            git pull --rebase || true
            git push
          fi

name: fotobot

on:
  schedule:
    # 3:30 UTC = 5:30 v Praze v letním čase, 4:30 v zimním. Běží Po–Pá.
    # Stalker startuje v 8:00 pražského času, takže rezerva je dvě a půl hodiny.
    # Cron na GitHubu je jen orientační a ve špičce startuje i o dvacet minut
    # později — proto ta velká rezerva.
    - cron: "30 3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fotobot
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    # Celý běh dnes trvá kolem hodiny (focení ~20 min, rozšíření ~35 min).
    # Původních 40 minut ho zabíjelo uprostřed.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Nainstaluj Playwright a Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.49.1 sharp@0.33.5
          npx playwright install --with-deps chromium

      - name: Vyfoť weby
        env:
          OWN_HOME_URL: ${{ secrets.OWN_HOME_URL }}
          OWN_AI_URL: ${{ secrets.OWN_AI_URL }}
          OWN_AUTOMATION_URL: ${{ secrets.OWN_AUTOMATION_URL }}
          OWN_PRICING_URL: ${{ secrets.OWN_PRICING_URL }}
          OWN_FEATURES_URL: ${{ secrets.OWN_FEATURES_URL }}
          OWN_INTEGRATIONS_URL: ${{ secrets.OWN_INTEGRATIONS_URL }}
          OWN_ABOUT_URL: ${{ secrets.OWN_ABOUT_URL }}
          OWN_CAREERS_URL: ${{ secrets.OWN_CAREERS_URL }}
          OWN_SITEMAP_URL: ${{ secrets.OWN_SITEMAP_URL }}
        run: node shoot.mjs

      # POJISTKA: fotky se commitnou hned po focení. Kdyby se rozšíření
      # zaseklo nebo doběhlo do timeoutu, fotky už jsou v repu a Stalker
      # má z čeho brát.
      - name: Commitni fotky
        run: |
          git config user.name "fotobot"
          git config user.email "fotobot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nic nového, necommituju."
          else
            CHANGED=$(node -e "const r=require('./report.json');console.log(r.counts.changed+'/'+r.counts.targets)")
            git commit -m "fotky $(date -u +%F) (zmeneno ${CHANGED})"
            git push
          fi

      - name: Feedy, ceníky, e-maily konkurence a datovaný archiv
        continue-on-error: true
        run: node extras.mjs

      - name: Kalendáře akcí (přednášky a talky)
        continue-on-error: true
        run: node akce.mjs

      - name: Ukliď staré jednorázové fotky
        # Hlavní úklid (60 dní, všechny datované složky) si dělá extras.mjs sám.
        # Tohle je jen záloha pro případ, že by rozšíření nedoběhlo.
        run: |
          find queue-shots -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find changed -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find emails -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find pricing-shots -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find daily -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true
          find rescue -mindepth 1 -maxdepth 1 -type d -mtime +60 -exec rm -rf {} + 2>/dev/null || true

      - name: Commitni rozšíření a úklid
        if: always()
        run: |
          git config user.name "fotobot"
          git config user.email "fotobot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rozšíření nic nezměnilo, necommituju."
          else
            git commit -m "rozsireni $(date -u +%F)"
            git pull --rebase
            git push
          fi
